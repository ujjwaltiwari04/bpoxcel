# =====================================================
# Netlify Configuration — BPOXCEL (https://bpoxcel.com)
# Enforces HTTPS, canonical domain redirects, and security headers
# =====================================================

[build]
  publish = "."

# ── Global Security & HTTPS Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    # Strictly enforce HTTPS for 2 years across domain and subdomains
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Automatically upgrade any http:// requests to https:// and prevent clickjacking
    Content-Security-Policy = "upgrade-insecure-requests; frame-ancestors 'self'"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Prevent unauthorized iframe embedding
    X-Frame-Options = "SAMEORIGIN"
    # Protect referrer privacy while preserving origin for analytics
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable unused sensitive browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Force HTTPS & Canonical Apex Domain (bpoxcel.com) ──
[[redirects]]
  from = "http://bpoxcel.com/*"
  to = "https://bpoxcel.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bpoxcel.com/*"
  to = "https://bpoxcel.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bpoxcel.com/*"
  to = "https://bpoxcel.com/:splat"
  status = 301
  force = true

# ── Clean URL Rewrites (parity with serve.json) ──
